<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A library of web projects I built as a student.">
    <title>Student Projects · Samuelle Celis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="dist/styles.css">
    <script src="assets/app.js" defer></script>
</head>
<body class="min-h-screen bg-white font-sans text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100">
    <div class="mx-auto flex min-h-screen max-w-5xl flex-col px-6 py-16 sm:py-24" data-launcher>
        <header class="mb-14 sm:mb-20">
            <p class="text-xs font-medium uppercase tracking-[0.2em] text-neutral-400">Archive</p>
            <h1 class="mt-3 text-3xl font-semibold tracking-tight sm:text-4xl">Student Projects</h1>
            <p class="mt-3 max-w-md text-neutral-500 dark:text-neutral-400">
                A small library of the web projects I built while studying. Select one to open it.
            </p>
        </header>

        <main class="flex-1">
            <ul class="grid gap-x-8 gap-y-12 sm:grid-cols-2" data-project-list></ul>
        </main>

        <footer class="mt-20 border-t border-neutral-100 pt-6 text-sm text-neutral-400 dark:border-neutral-900">
            &copy; <span data-year></span> Samuelle Celis
        </footer>
    </div>

    <section
        class="fixed inset-0 z-50 hidden flex-col bg-white dark:bg-neutral-950"
        role="dialog"
        aria-modal="true"
        aria-labelledby="viewer-title"
        data-viewer
    >
        <div class="flex h-14 shrink-0 items-center justify-between gap-4 border-b border-neutral-200 px-4 sm:px-6 dark:border-neutral-800">
            <button
                type="button"
                class="inline-flex items-center gap-2 rounded-md px-2 py-1.5 text-sm text-neutral-600 transition hover:bg-neutral-100 hover:text-neutral-900 focus-visible:outline-2 focus-visible:outline-neutral-400 dark:text-neutral-400 dark:hover:bg-neutral-900 dark:hover:text-neutral-100"
                data-viewer-close
            >
                <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                <span>All projects</span>
            </button>
            <h2 id="viewer-title" class="truncate text-sm font-medium" data-viewer-title></h2>
            <a
                href="#"
                target="_blank"
                rel="noopener"
                class="inline-flex items-center gap-2 rounded-md px-2 py-1.5 text-sm text-neutral-600 transition hover:bg-neutral-100 hover:text-neutral-900 focus-visible:outline-2 focus-visible:outline-neutral-400 dark:text-neutral-400 dark:hover:bg-neutral-900 dark:hover:text-neutral-100"
                data-viewer-external
            >
                <span class="hidden sm:inline">Open in new tab</span>
                <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M7 17 17 7M8 7h9v9"/>
                </svg>
            </a>
        </div>
        <iframe class="w-full flex-1 bg-white" title="" data-viewer-frame></iframe>
    </section>

    <template id="project-card">
        <li>
            <a href="#" class="group block focus-visible:outline-none" data-card-link>
                <div class="relative aspect-[16/10] overflow-hidden rounded-lg border border-neutral-200 bg-neutral-50 transition duration-300 group-hover:border-neutral-300 group-hover:shadow-sm group-focus-visible:ring-2 group-focus-visible:ring-neutral-400 group-focus-visible:ring-offset-4 dark:border-neutral-800 dark:bg-neutral-900 dark:group-hover:border-neutral-700 dark:ring-offset-neutral-950" data-card-preview>
                    <iframe
                        class="pointer-events-none absolute left-0 top-0 origin-top-left border-0 bg-white"
                        loading="lazy"
                        tabindex="-1"
                        aria-hidden="true"
                        data-card-frame
                    ></iframe>
                </div>
                <div class="mt-4 flex items-baseline gap-3">
                    <span class="font-mono text-xs text-neutral-400" data-card-index></span>
                    <h3 class="font-medium transition group-hover:text-neutral-600 dark:group-hover:text-neutral-300" data-card-title></h3>
                </div>
                <p class="mt-1.5 pl-8 text-sm leading-relaxed text-neutral-500 dark:text-neutral-400" data-card-description></p>
                <ul class="mt-3 flex flex-wrap gap-1.5 pl-8" data-card-tags></ul>
            </a>
        </li>
    </template>
</body>
</html>
